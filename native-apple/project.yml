name: CreditRepairAIApple
options:
  bundleIdPrefix: com.creditrepairai
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '2.1.0'
    CURRENT_PROJECT_VERSION: '20261101'
    PRODUCT_MODULE_NAME: CreditRepairAI
    CREDIT_AGENT_ENDPOINT: ''
    GOOGLE_REVERSED_CLIENT_ID: ''
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 9.0.0
targetTemplates:
  Client:
    type: application
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: CreditRepairAI
        CreditAgentEndpoint: $(CREDIT_AGENT_ENDPOINT)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SUPPORTS_MACCATALYST: NO
    entitlements:
      path: Generated/Client.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)]
targets:
  CreditRepairAI-iOS:
    templates: [Client]
    platform: iOS
    sources:
      - path: Config/ios
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.creditrepairai.v2.ios
        TARGETED_DEVICE_FAMILY: '1'
  CreditRepairAI-iPadOS:
    templates: [Client]
    platform: iOS
    sources:
      - path: Config/ipados
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.creditrepairai.v2.ipados
        TARGETED_DEVICE_FAMILY: '2'
  CreditRepairAI-macOS:
    templates: [Client]
    platform: macOS
    sources:
      - path: Config/macos
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.creditrepairai.v2.macos
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readwrite
  CreditRepairAI-macOSTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes: [Fixtures]
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
      - path: Resources/domain.js
        buildPhase: resources
    dependencies:
      - target: CreditRepairAI-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.creditrepairai.v2.macos.tests
schemes:
  CreditRepairAI-iOS:
    build:
      targets:
        CreditRepairAI-iOS: all
  CreditRepairAI-iPadOS:
    build:
      targets:
        CreditRepairAI-iPadOS: all
  CreditRepairAI-macOS:
    build:
      targets:
        CreditRepairAI-macOS: all
    test:
      targets: [CreditRepairAI-macOSTests]
