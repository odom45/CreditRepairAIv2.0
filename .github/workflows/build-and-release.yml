name: Validate CreditRepairAI web parity
on:
  push:
    branches: [main, web-android-parity, ios-native, ipados-native, macos-native]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:web
      - run: npm run test:agent
      - run: npm run build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_CREDIT_AGENT_ENDPOINT: ${{ vars.CREDIT_PRODUCTION_GATEWAY_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: creditrepairai-web-candidate
          path: dist/
          retention-days: 14
