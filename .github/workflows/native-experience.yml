name: Native account, dispute and letter journeys
on:
  pull_request:
    branches: [android-native-rebuild]
    paths: ["native-android/**", "convex/**", "tests/**", ".github/workflows/native-experience.yml"]
  push:
    branches: [android-native-rebuild]
    paths: ["native-android/**", "convex/**", "tests/**", ".github/workflows/native-experience.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:launch
  native-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: native-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test native implementation
        run: bash ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: All native device regressions including account, bureau and physical-letter journeys
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: native-android
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Preserve test and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CreditRepairAI-native-journeys
          path: |
            native-android/app/build/reports/
            native-android/app/build/test-results/
            native-android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 90
