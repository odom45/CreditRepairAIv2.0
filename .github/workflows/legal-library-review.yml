name: Legal library freshness

on:
  push:
    paths:
      - "legal-library/**"
      - "scripts/check-legal-library.mjs"
      - ".github/workflows/legal-library-review.yml"
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check review age and official source links
        run: node scripts/check-legal-library.mjs --check-links
