name: Signed Android release

on:
  push:
    branches: [android-native-rebuild]
    paths:
      - ".github/workflows/signed-android-release.yml"
      - "native-android/**"
      - "convex/**"
  workflow_dispatch:
    inputs:
      version_code:
        description: "Play version code (must exceed the previous release)"
        required: true
        default: "20261015"
      version_name:
        description: "User-visible version name"
        required: true
        default: "2.0.2"

permissions:
  contents: read
  actions: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: native-android
    env:
      CREDIT_SUPPORT_EMAIL: ${{ vars.CREDIT_SUPPORT_EMAIL || 'admin@synergyfundai.com' }}
      CREDIT_PAID_ACCESS_ENABLED: ${{ vars.CREDIT_PAID_ACCESS_ENABLED || 'false' }}
      ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/native-android/creditrepair-upload.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate protected release configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CREDIT_AI_GATEWAY_URL: ${{ secrets.CREDIT_AI_GATEWAY_URL }}
          VERSION_CODE: ${{ inputs.version_code || '20261015' }}
          VERSION_NAME: ${{ inputs.version_name || '2.0.2' }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$CREDIT_SUPPORT_EMAIL"
          case "$CREDIT_PAID_ACCESS_ENABLED" in true|false) ;; *) echo "CREDIT_PAID_ACCESS_ENABLED must be true or false"; exit 1;; esac
          case "$CREDIT_AI_GATEWAY_URL" in https://*) ;; *) echo "CREDIT_AI_GATEWAY_URL must be HTTPS"; exit 1;; esac
          case "$VERSION_CODE" in ''|*[!0-9]*) echo "version_code must contain digits only"; exit 1;; esac
          test "$VERSION_CODE" -gt 0
          test -n "$VERSION_NAME"
          case "$VERSION_NAME" in *[!0-9A-Za-z._-]*) echo "version_name contains unsupported characters"; exit 1;; esac
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed Play bundle and tester APK
        env:
          CREDIT_AI_GATEWAY_URL: ${{ secrets.CREDIT_AI_GATEWAY_URL }}
          VERSION_CODE: ${{ inputs.version_code || '20261015' }}
          VERSION_NAME: ${{ inputs.version_name || '2.0.2' }}
        run: ./gradlew bundleRelease assembleRelease -PCREDIT_AI_GATEWAY_URL="$CREDIT_AI_GATEWAY_URL" -PCREDIT_VERSION_CODE="$VERSION_CODE" -PCREDIT_VERSION_NAME="$VERSION_NAME" -PCREDIT_SUPPORT_EMAIL="$CREDIT_SUPPORT_EMAIL" -PCREDIT_PAID_ACCESS_ENABLED="$CREDIT_PAID_ACCESS_ENABLED" --stacktrace

      - name: Verify signatures
        run: |
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab | tee "$RUNNER_TEMP/aab-signature.txt"
          grep -q "jar verified" "$RUNNER_TEMP/aab-signature.txt"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Download previous owner-signed release for update acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASELINE_ID=11767788438
          if ! gh api "repos/odom45/CreditRepairAIv2.0/actions/artifacts/$BASELINE_ID" --jq '.expired == false' | grep -qx true; then
            BASELINE_ID="$(gh api 'repos/odom45/CreditRepairAIv2.0/actions/artifacts?name=CreditRepairAI-signed-release-apk&per_page=100' --jq '[.artifacts[] | select(.name == "CreditRepairAI-signed-release-apk" and .expired == false and .workflow_run.id != (env.GITHUB_RUN_ID | tonumber))] | sort_by(.created_at) | reverse | .[0].id')"
          fi
          case "$BASELINE_ID" in ''|null|*[!0-9]*) echo 'No unexpired prior signed APK is available for update acceptance.'; exit 1;; esac
          gh api "repos/odom45/CreditRepairAIv2.0/actions/artifacts/$BASELINE_ID/zip" > "$RUNNER_TEMP/creditrepairai-previous.zip"
          mkdir -p "$RUNNER_TEMP/creditrepairai-previous"
          unzip -q "$RUNNER_TEMP/creditrepairai-previous.zip" -d "$RUNNER_TEMP/creditrepairai-previous"
          test -f "$RUNNER_TEMP/creditrepairai-previous/app-release.apk"

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify release installation and in-place update
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          working-directory: native-android
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ../scripts/release-install-smoke.sh "$RUNNER_TEMP/creditrepairai-previous/app-release.apk" app/build/outputs/apk/release/app-release.apk "${{ inputs.version_code || '20261015' }}" "$GITHUB_WORKSPACE/release-install-smoke.json"

      - name: Upload release acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: CreditRepairAI-release-install-acceptance
          path: release-install-smoke.json
          if-no-files-found: error

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: CreditRepairAI-signed-play-aab
          path: native-android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove ephemeral decoded signing file
        if: always()
        run: |
          if [ -f "$ANDROID_KEYSTORE_FILE" ]; then
            rm -- "$ANDROID_KEYSTORE_FILE"
          fi

      - name: Upload signed tester APK
        uses: actions/upload-artifact@v4
        with:
          name: CreditRepairAI-signed-release-apk
          path: native-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
