name: Deploy configured production legal agent

on:
  push:
    branches: [android-native-rebuild]
    paths:
      - ".github/workflows/deploy-legal-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-legal-agent
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CREDIT_PRODUCTION_DEPLOY_KEY }}
      CREDIT_PRODUCTION_DEPLOYMENT: ${{ vars.CREDIT_PRODUCTION_DEPLOYMENT }}
      CREDIT_AI_GATEWAY_URL: ${{ vars.CREDIT_PRODUCTION_GATEWAY_URL }}
      CREDIT_SUPPORT_EMAIL: ${{ vars.CREDIT_SUPPORT_EMAIL }}
      CREDIT_PAID_ACCESS_ENABLED: ${{ vars.CREDIT_PAID_ACCESS_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:launch
      - run: npm run legal:check
      - run: npm run policies:check
      - run: npm run audit:source-secrets
      - name: Require genuine Firebase package and certificate registrations
        run: node scripts/firebase-signing-readiness.mjs --require-ready
      - name: Require existing production configuration and deploy checked source
        run: node scripts/production-configuration.mjs --deploy
      - name: Retain public deployment status without credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CreditRepairAI-production-configuration
          path: |
            production-configuration.json
            firebase-signing-readiness.json
