name: Parser robustness and synthetic corpus
on:
  push:
    branches: [android-native-rebuild, parser-robustness-completion]
    paths:
      - "native-android/**"
      - ".github/workflows/parser-robustness.yml"
  pull_request:
    branches: [android-native-rebuild]
    paths:
      - "native-android/**"
      - ".github/workflows/parser-robustness.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: parser-robustness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parser-properties:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: native-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Seeded fuzz, properties, limits and all existing JVM regressions
        run: timeout --signal=KILL 18m ./gradlew testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parser-properties-junit
          path: |
            native-android/app/build/test-results/testDebugUnitTest/
            native-android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
  parser-pdf-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: native-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real PDF mutations, expanded OCR corpus and original 60-case batch
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: native-android
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: timeout --signal=KILL 25m ./gradlew connectedDebugAndroidTest lintDebug -Pandroid.testInstrumentationRunnerArguments.package=com.creditrepairai.v2.analysis --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parser-pdf-ocr-junit
          path: |
            native-android/app/build/outputs/androidTest-results/
            native-android/app/build/reports/androidTests/
            native-android/app/build/reports/lint-results-debug.*
          if-no-files-found: error
