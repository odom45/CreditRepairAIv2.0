name: Native Android test APK

on:
  push:
    branches: [android-native-rebuild]
    paths:
      - "native-android/**"
      - "convex/**"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "policies/**"
      - "public/legal/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/native-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Verify existing protected configuration without exposing values
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CREDIT_AI_GATEWAY_URL: ${{ secrets.CREDIT_AI_GATEWAY_URL }}
          CREDIT_SUPPORT_EMAIL: ${{ vars.CREDIT_SUPPORT_EMAIL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/staging-preflight.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: CreditRepairAI-staging-preflight
          path: staging-preflight.json
  validate-backend-and-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/configure-public-support.mjs
        env:
          CREDIT_SUPPORT_EMAIL: ${{ vars.CREDIT_SUPPORT_EMAIL }}
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: CreditRepairAI-public-policy-pages
          path: dist/legal/
      - run: npx tsc --noEmit -p convex/tsconfig.json
      - run: npm run test:launch
      - run: npm run legal:check
      - run: npm run audit:source-secrets
      - run: node scripts/generate-policies.mjs --check
  build-native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build installable APK
        env:
          CREDIT_AI_GATEWAY_URL: ${{ secrets.CREDIT_AI_GATEWAY_URL }}
          CREDIT_SUPPORT_EMAIL: ${{ vars.CREDIT_SUPPORT_EMAIL }}
        run: ./gradlew assembleDebug --stacktrace -PCREDIT_AI_GATEWAY_URL="${CREDIT_AI_GATEWAY_URL:-https://lovable-dinosaur-379.convex.site}" -PCREDIT_SUPPORT_EMAIL="$CREDIT_SUPPORT_EMAIL"

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CreditRepairAI-native-unit-tests
          path: native-android/app/build/reports/tests/testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CreditRepairAI-native-debug-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
  native-device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: native-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run fictional device flows and parser tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2, verified tag target
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: native-android
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest lintDebug --stacktrace
      - name: Upload device and lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CreditRepairAI-device-and-lint-reports
          path: |
            native-android/app/build/reports/androidTests/
            native-android/app/build/outputs/androidTest-results/
            native-android/app/build/reports/lint-results-debug.*
