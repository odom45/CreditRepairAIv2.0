name: Measured synthetic Android PDF parser batch
on:
  push:
    branches: [android-native-rebuild]
    paths: [".github/workflows/parser-validation-batch.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measured-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: native-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Require exact parser results and validate complete metric export
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: native-android
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash ../scripts/run-parser-batch.sh current true
      - name: Upload complete measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CreditRepairAI-parser-current
          path: |
            native-android/parser-validation-current.json
            native-android/app/build/reports/androidTests/
          if-no-files-found: error
          retention-days: 90
